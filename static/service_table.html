  <script>
    document.querySelector('.custom-select-trigger').addEventListener('click', function () {
      document.querySelector('.custom-options').classList.toggle('hidden');
    });

    document.querySelectorAll('.custom-options div').forEach(function (option) {
      option.addEventListener('click', function () {
        document.querySelector('.custom-select-trigger').textContent = this.textContent;
        document.querySelector('.custom-options').classList.add('hidden');
      });
    });

    document.addEventListener('click', function (e) {
      if (!document.querySelector('.custom-select').contains(e.target)) {
        document.querySelector('.custom-options').classList.add('hidden');
      }
    });
  </script>
